name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://brainstorm:brainstorm@localhost:5432/brainstorm_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create non-superuser app role + test DB
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE brainstorm LOGIN PASSWORD 'brainstorm' CREATEROLE;
          CREATE DATABASE brainstorm_test OWNER brainstorm;
          \c brainstorm_test
          CREATE EXTENSION IF NOT EXISTS vector;
          SQL
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
